openapi: 3.1.0
info:
  title: Shoot The Ball API
  version: 0.1.0
  description: AI Basketball Highlight Generator REST API
servers:
  - url: http://localhost:4321/v1
    description: Local development
tags:
  - name: Auth
  - name: Projects
  - name: Videos
  - name: Jobs
  - name: Highlights
  - name: Exports
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  service: { type: string }
                  ts: { type: integer }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegisterRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginRequest" }
      responses:
        "200":
          description: Login OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user profile
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
  /projects:
    get:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      summary: List my projects
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectListResponse" }
    post:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
  /projects/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      summary: Get project detail with videos
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
    patch:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200": { description: OK }
    delete:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
  /videos/upload-session:
    post:
      tags: [Videos]
      security: [{ bearerAuth: [] }]
      summary: Request direct upload session (signed URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSessionResponse" }
  /videos/{id}/complete:
    post:
      tags: [Videos]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteUploadRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoResponse" }
  /videos/{id}/calibration:
    post:
      tags: [Videos]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalibrationRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoResponse" }
  /videos/{id}/process:
    post:
      tags: [Videos, Jobs]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      summary: Start AI processing job
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessVideoResponse" }
  /videos/{id}/highlights:
    get:
      tags: [Videos, Highlights]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HighlightsResponse" }
  /jobs/{id}:
    get:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
  /jobs/{id}/events:
    get:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: SSE processing progress stream
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: SSE stream (event: progress / completed / failed)
          content:
            text/event-stream: {}
  /highlights/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Highlights]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HighlightResponse" }
    patch:
      tags: [Highlights]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHighlightRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HighlightResponse" }
    delete:
      tags: [Highlights]
      security: [{ bearerAuth: [] }]
      summary: Soft-delete highlight
      responses:
        "204": { description: Deleted }
  /exports:
    post:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      summary: Enqueue INDIVIDUAL or MERGE export
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportRequest" }
      responses:
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateExportResponse" }
  /exports/{id}:
    get:
      tags: [Exports]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GetExportResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Roi:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
    UserRole: { type: string, enum: [USER, ADMIN] }
    User:
      type: object
      required: [id, email, name, role, createdAt, updatedAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: [string, null] }
        role: { $ref: "#/components/schemas/UserRole" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [user]
      properties: { user: { $ref: "#/components/schemas/User" } }
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    AuthRegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        name: { type: string, minLength: 1, maxLength: 64 }
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
    Project:
      type: object
      required: [id, userId, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        coverUrl: { type: [string, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResponse:
      type: object
      required: [project]
      properties: { project: { $ref: "#/components/schemas/Project" } }
    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        coverUrl: { type: [string, null] }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        coverUrl: { type: [string, null] }
    VideoStatus:
      type: string
      enum: [UPLOADING, UPLOADED, PROCESSING, PROCESSED, FAILED, ARCHIVED]
    Video:
      type: object
      required:
        [
          id,
          projectId,
          userId,
          title,
          filename,
          storageKey,
          contentType,
          sizeBytes,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        userId: { type: string }
        title: { type: string }
        filename: { type: string }
        storageKey: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        duration: { type: [number, null] }
        width: { type: [integer, null] }
        height: { type: [integer, null] }
        fps: { type: [number, null] }
        status: { $ref: "#/components/schemas/VideoStatus" }
        sourceUrl: { type: [string, null] }
        calibration:
          type: [object, null]
          properties:
            hoopRoi: { $ref: "#/components/schemas/Roi" }
            courtRoi: { $ref: "#/components/schemas/Roi" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VideoResponse:
      type: object
      required: [video]
      properties: { video: { $ref: "#/components/schemas/Video" } }
    UploadSessionRequest:
      type: object
      required: [projectId, filename, contentType, size]
      properties:
        projectId: { type: string }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, minimum: 1 }
    UploadSessionResponse:
      type: object
      required: [videoId, storageKey, uploadUrl]
      properties:
        videoId: { type: string }
        storageKey: { type: string }
        uploadUrl: { type: string, format: uri }
    CompleteUploadRequest:
      type: object
      properties:
        duration: { type: number, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        fps: { type: number, minimum: 0 }
    CalibrationRequest:
      type: object
      required: [hoopRoi]
      properties:
        hoopRoi: { $ref: "#/components/schemas/Roi" }
        courtRoi: { $ref: "#/components/schemas/Roi" }
    ProcessingJobStatus:
      type: string
      enum:
        [
          UPLOADED,
          PREPARING,
          DETECTING,
          VERIFYING,
          GENERATING_CLIPS,
          READY,
          EXPORTING,
          EXPORTED,
          FAILED,
        ]
    ProcessingJob:
      type: object
      required:
        [
          id,
          videoId,
          projectId,
          userId,
          status,
          progress,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        videoId: { type: string }
        projectId: { type: string }
        userId: { type: string }
        status: { $ref: "#/components/schemas/ProcessingJobStatus" }
        stage: { type: [string, null] }
        progress: { type: number, minimum: 0, maximum: 1 }
        errorMessage: { type: [string, null] }
        pipelineVersion: { type: [string, null] }
        modelVersion: { type: [string, null] }
        startedAt: { type: [string, null], format: date-time }
        completedAt: { type: [string, null], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobResponse:
      type: object
      required: [job]
      properties: { job: { $ref: "#/components/schemas/ProcessingJob" } }
    ProcessVideoResponse:
      type: object
      required: [jobId]
      properties: { jobId: { type: string } }
    HighlightType:
      type: string
      enum:
        [MADE_BASKET, THREE_POINTER, ASSIST, STEAL, BLOCK, REBOUND, OTHER]
    HighlightUserStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    Highlight:
      type: object
      required:
        [
          id,
          videoId,
          startTime,
          endTime,
          eventTime,
          confidence,
          type,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        videoId: { type: string }
        startTime: { type: number, minimum: 0 }
        endTime: { type: number, minimum: 0 }
        eventTime: { type: number, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        type: { $ref: "#/components/schemas/HighlightType" }
        clipUrl: { type: [string, null] }
        clipStorageKey: { type: [string, null] }
        thumbnailUrl: { type: [string, null] }
        metadata: { type: [object, null] }
        userStatus: { $ref: "#/components/schemas/HighlightUserStatus" }
        selected: { type: boolean }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HighlightResponse:
      type: object
      required: [highlight]
      properties:
        highlight: { $ref: "#/components/schemas/Highlight" }
    HighlightsResponse:
      type: object
      required: [highlights]
      properties:
        highlights:
          type: array
          items: { $ref: "#/components/schemas/Highlight" }
    UpdateHighlightRequest:
      type: object
      properties:
        startTime: { type: number, minimum: 0 }
        endTime: { type: number, minimum: 0 }
        userStatus: { $ref: "#/components/schemas/HighlightUserStatus" }
    ExportType: { type: string, enum: [INDIVIDUAL, MERGE] }
    ExportFormat: { type: string, enum: [MP4_HD, MP4_FULL_HD, MP4_4K] }
    ExportStatus: { type: string, enum: [QUEUED, EXPORTING, EXPORTED, FAILED] }
    ExportItem:
      type: object
      required:
        [id, exportId, highlightId, orderIndex, startTime, endTime, createdAt]
      properties:
        id: { type: string }
        exportId: { type: string }
        highlightId: { type: string }
        orderIndex: { type: integer, minimum: 0 }
        startTime: { type: number, minimum: 0 }
        endTime: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
    Export:
      type: object
      required:
        [
          id,
          projectId,
          userId,
          type,
          format,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        projectId: { type: string }
        userId: { type: string }
        type: { $ref: "#/components/schemas/ExportType" }
        format: { $ref: "#/components/schemas/ExportFormat" }
        status: { $ref: "#/components/schemas/ExportStatus" }
        storageKey: { type: [string, null] }
        downloadUrl: { type: [string, null] }
        sizeBytes: { type: [integer, null], format: int64 }
        duration: { type: [number, null] }
        errorMessage: { type: [string, null] }
        startedAt: { type: [string, null], format: date-time }
        completedAt: { type: [string, null], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        exportItems:
          type: array
          items: { $ref: "#/components/schemas/ExportItem" }
    CreateExportRequest:
      type: object
      required: [projectId, type, highlightIds]
      properties:
        projectId: { type: string }
        type: { $ref: "#/components/schemas/ExportType" }
        format: { $ref: "#/components/schemas/ExportFormat" }
        highlightIds:
          type: array
          minItems: 1
          items: { type: string }
    CreateExportResponse:
      type: object
      required: [export]
      properties: { export: { $ref: "#/components/schemas/Export" } }
    GetExportResponse:
      type: object
      required: [export]
      properties:
        export: { $ref: "#/components/schemas/Export" }
        downloadUrl: { type: [string, null], format: uri }
