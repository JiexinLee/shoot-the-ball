# ==============================================================
# Shoot-The-Ball · 开发模式 · 最简基础设施
# --------------------------------------------------------------
# 只起 Postgres + Redis 两个官方镜像（Docker Hub 下载量 Top10，100% 能拉到）
# 对象存储直接复用根目录 .env 已填好的 Cloudflare R2 Dev 凭据，
# 不跑 MinIO / 不搞 S3 兼容容器，彻底甩开所有对象存储镜像的坑。
#
# 启动：docker compose up -d
# 验证：docker compose ps
#       → postgres = Running (healthy) / redis = Running (healthy)
# ==============================================================
name: shoot-the-ball-dev

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 · 开发 DB
  #   默认端口：本机 127.0.0.1:5432
  #   账密：shoot / shootdevpass123
  #   数据库：shoot_the_ball_dev
  # ------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB: shoot_the_ball_dev
      POSTGRES_USER: shoot
      POSTGRES_PASSWORD: shootdevpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoot -d shoot_the_ball_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  # ------------------------------------------------------------
  # Redis 7 · BullMQ 队列 + 缓存
  #   默认端口：本机 127.0.0.1:6379
  #   密码：shootredisdevpass123（env.development.local 一致）
  #   ⚠️ maxmemory-policy = noeviction：队列不能被 Redis LRU 弹掉！
  # ------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "shootredisdevpass123",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a shootredisdevpass123 ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

volumes:
  postgres_data:
  redis_data:
