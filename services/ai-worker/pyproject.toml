[tool.poetry]
name = "shoot-the-ball-ai-worker"
version = "0.1.0"
description = "Shoot The Ball - Python AI Worker for basketball highlight detection"
authors = ["Shoot The Ball Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
loguru = "^0.7.2"
redis = { version = "^5.0.1", extras = ["hiredis"] }
rq = ">=1.16.1,<3.0.0"
httpx = "^0.26.0"
boto3 = "^1.34.0"
numpy = "^1.26.0"
opencv-python-headless = "^4.9.0.80"
scipy = "^1.11.4"
ultralytics = "^8.1.0"
tqdm = "^4.66.1"
python-slugify = "^8.0.3"
torch = { version = "^2.1.0", markers = "sys_platform != 'linux'" }
torchvision = { version = "^0.16.0", markers = "sys_platform != 'linux'" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
ruff = "^0.1.14"
mypy = "^1.8.0"
types-redis = "^4.6.0.20240106"
pytest-mock = "^3.12.0"

[tool.poetry.group.cuda]
optional = true

[tool.poetry.group.cuda.dependencies]
torch = { version = "^2.1.0", source = "torch-cu121", markers = "sys_platform == 'linux'" }
torchvision = { version = "^0.16.0", source = "torch-cu121", markers = "sys_platform == 'linux'" }

[[tool.poetry.source]]
name = "torch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.scripts]
stb-worker = "app.worker:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
